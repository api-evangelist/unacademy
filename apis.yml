aid: unacademy
name: Unacademy
description: Unacademy is a Bangalore-based online learning platform — one of India's
  largest — offering live classes, courses, study material, and test preparation for
  competitive exams including UPSC Civil Services, IIT JEE, NEET-UG, SSC, CA Foundation,
  and CSIR UGC NET, delivered through its web platform and dedicated learner, educator,
  and parent mobile apps. Backed by SoftBank Vision Fund, Unacademy runs a consumer
  platform on an internal API (api.unacademy.com) but publishes no public developer
  program, API documentation, or SDKs.
